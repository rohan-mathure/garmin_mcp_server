name: Release CLI Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          - runner: macos-latest
            os: macos
            arch: x86_64
          - runner: windows-latest
            os: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build CLI binary (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller \
            --onefile \
            --name garmin-cli \
            --hidden-import=garminconnect \
            --hidden-import=curl_cffi \
            --hidden-import=typer \
            --hidden-import=rich \
            --hidden-import=apscheduler \
            --hidden-import=psycopg2 \
            --hidden-import=dotenv \
            -p src \
            src/garmin_mcp/__cli_wrapper__.py

      - name: Build CLI binary (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller `
            --onefile `
            --name garmin-cli `
            --hidden-import=garminconnect `
            --hidden-import=curl_cffi `
            --hidden-import=typer `
            --hidden-import=rich `
            --hidden-import=apscheduler `
            --hidden-import=psycopg2 `
            --hidden-import=dotenv `
            -p src `
            src/garmin_mcp/__cli_wrapper__.py

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "macos" ]; then
            mv garmin-cli garmin-cli-macos-${{ matrix.arch }}
          else
            mv garmin-cli garmin-cli-linux-${{ matrix.arch }}
          fi

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          mv garmin-cli.exe garmin-cli-windows-${{ matrix.arch }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/garmin-cli*

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find binaries -type f -name "garmin-cli*" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/garmin-cli*
          draft: false
          prerelease: false
          generate_release_notes: true
