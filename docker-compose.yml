version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: garmin
      POSTGRES_USER: garmin
      POSTGRES_PASSWORD: garmin
    volumes:
      - ts_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - TIMESCALE_URL=postgresql://garmin:garmin@timescaledb:5432/garmin
    volumes:
      - ${HOME}/.config/rclone:/root/.config/rclone:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ts_data:
    driver: local
