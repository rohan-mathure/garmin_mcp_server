[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server for Garmin Connect"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "garminconnect>=0.3.0",
    "curl_cffi>=0.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12",
    "rich>=13.0",
    "apscheduler>=3.10",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp.__main__:main"
garmin-cli = "garmin_mcp.cli.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=garmin_mcp --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["garmin_mcp"]

[tool.coverage.report]
omit = [
    "*/garmin_mcp/__main__.py",
    "*/garmin_mcp/cli/__main__.py",
    "*/garmin_mcp/scraper/__main__.py",
]
fail_under = 90
