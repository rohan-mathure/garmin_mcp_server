[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server for Garmin Connect"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "garminconnect>=0.3.0",
    "curl_cffi>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
